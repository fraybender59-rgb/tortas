<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comandero - La Queen 👑</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { padding: 15px; background: #f4f4f9; color: #333; }
    h1, h2 { margin-bottom: 15px; text-align: center; }
    .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1200px; margin: 0 auto; }
    .menu-section { flex: 2; min-width: 320px; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .order-section { flex: 1; min-width: 280px; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .categories { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
    .cat-btn { padding: 10px 14px; border: 1px solid #ccc; background: #e0e0e0; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .cat-btn:hover { background: #d0d0d0; }
    .cat-btn.active { background: #d32f2f; color: #fff; border-color: #b71c1c; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .item-btn { padding: 12px 8px; border: 1px solid #ddd; background: #fafafa; border-radius: 6px; text-align: center; cursor: pointer; font-weight: bold; display: flex; flex-direction: column; justify-content: space-between; min-height: 75px; transition: 0.2s; }
    .item-btn:hover { background: #ffebee; border-color: #d32f2f; transform: translateY(-2px); }
    .item-btn .price { font-size: 0.9em; color: #2e7d32; margin-top: 5px; }
    .order-list { list-style: none; margin: 15px 0; max-height: 250px; overflow-y: auto; border-top: 1px solid #eee; }
    .order-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
    .remove-btn { background: #ff5252; color: white; border: none; border-radius: 3px; padding: 3px 8px; cursor: pointer; font-weight: bold; }
    .input-field { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
    .btn-send { width: 100%; padding: 12px; background: #2e7d32; color: white; font-size: 16px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s; }
    .btn-send:hover { background: #1b5e20; }
  </style>
</head>
<body>

  <h1>Comandero - La Queen 👑</h1>

  <div class="container">
    <div class="menu-section">
      <h2>Categorías</h2>
      <div id="categories" class="categories"></div>
      <div id="products" class="products-grid"></div>
    </div>
    <div class="order-section">
      <h2>Pedido Actual</h2>
      <input type="text" id="mesaInput" class="input-field" placeholder="Mesa / Nombre del Cliente">
      <ul id="orderList" class="order-list"></ul>
      <h3>Total: $<span id="totalPrice">0</span></h3>
      <br>
      <button class="btn-send" onclick="enviarACocina()">🚀 Marcar a Cocina</button>
    </div>
  </div>

  <script>
    let menuData = {};
    let currentOrder = [];

    async function init() {
      try {
        const res = await fetch('/api/menu');
        menuData = await res.json();
        renderCategories();
      } catch (e) {
        console.error("Error al cargar menú", e);
      }
    }

    function renderCategories() {
      const catContainer = document.getElementById('categories');
      catContainer.innerHTML = '';
      const categories = Object.keys(menuData);
      categories.forEach((cat, index) => {
        const btn = document.createElement('button');
        btn.className = `cat-btn ${index === 0 ? 'active' : ''}`;
        btn.innerText = cat;
        btn.onclick = () => {
          document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderProducts(cat);
        };
        catContainer.appendChild(btn);
      });
      if (categories.length > 0) renderProducts(categories[0]);
    }

    function renderProducts(category) {
      const prodContainer = document.getElementById('products');
      prodContainer.innerHTML = '';
      (menuData[category] || []).forEach(item => {
        const div = document.createElement('div');
        div.className = 'item-btn';
        div.innerHTML = `<span>${item.nombre}</span><span class="price">$${item.precio}</span>`;
        div.onclick = () => agregarAlPedido(item);
        prodContainer.appendChild(div);
      });
    }

    function agregarAlPedido(item) {
      const existe = currentOrder.find(p => p.nombre === item.nombre);
      if (existe) { existe.cantidad += 1; } else { currentOrder.push({ ...item, cantidad: 1 }); }
      renderOrder();
    }

    function renderOrder() {
      const list = document.getElementById('orderList');
      list.innerHTML = '';
      let total = 0;
      currentOrder.forEach((item, index) => {
        total += item.precio * item.cantidad;
        const li = document.createElement('li');
        li.className = 'order-item';
        li.innerHTML = `
          <span>${item.cantidad}x ${item.nombre}</span>
          <span>$${item.precio * item.cantidad}</span>
          <button class="remove-btn" onclick="quitarDelPedido(${index})">✕</button>
        `;
        list.appendChild(li);
      });
      document.getElementById('totalPrice').innerText = total;
    }

    function quitarDelPedido(index) {
      currentOrder.splice(index, 1);
      renderOrder();
    }

    async function enviarACocina() {
      const mesa = document.getElementById('mesaInput').value.trim();
      if (!mesa) return alert('Por favor escribe la mesa o nombre del cliente.');
      if (currentOrder.length === 0) return alert('Agrega al menos un producto.');

      const pedido = {
        cliente: mesa,
        items: currentOrder,
        estado: 'En Cocina',
        total: parseFloat(document.getElementById('totalPrice').innerText),
        origen: 'staff'
      };

      const res = await fetch('/api/pedidos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(pedido)
      });

      if (res.ok) {
        alert('¡Pedido enviado a cocina!');
        currentOrder = [];
        document.getElementById('mesaInput').value = '';
        renderOrder();
      } else {
        alert('Error al enviar el pedido.');
      }
    }

    init();
  </script>
</body>
</html>
