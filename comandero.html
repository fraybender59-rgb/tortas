<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comandero - La Queen 👑</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { padding: 15px; background: #f4f4f9; color: #333; }
    h1, h2 { margin-bottom: 15px; text-align: center; }
    .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1200px; margin: 0 auto; }
    .menu-section { flex: 2; min-width: 320px; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .order-section { flex: 1; min-width: 280px; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .categories { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
    .cat-btn { padding: 10px 14px; border: 1px solid #ccc; background: #e0e0e0; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .cat-btn:hover { background: #d0d0d0; }
    .cat-btn.active { background: #d32f2f; color: #fff; border-color: #b71c1c; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .item-btn { padding: 12px 8px; border: 1px solid #ddd; background: #fafafa; border-radius: 6px; text-align: center; cursor: pointer; font-weight: bold; display: flex; flex-direction: column; justify-content: space-between; min-height: 75px; transition: 0.2s; }
    .item-btn:hover { background: #ffebee; border-color: #d32f2f; transform: translateY(-2px); }
    .item-btn .price { font-size: 0.9em; color: #2e7d32; margin-top: 5px; }
    .item-btn .desc { font-size: 0.7em; color: #666; margin-top: 3px; }
    
    /* Estilos agregados para productos bloqueados o agotados */
    .item-btn.agotado { opacity: 0.6; filter: grayscale(100%); pointer-events: none; border-color: #9e9e9e; background: #eee; cursor: not-allowed; }
    .item-btn.agotado .price { color: #d32f2f; font-weight: bold; }
    .alerta-hora { color: #d32f2f; font-size: 0.7em; font-weight: bold; margin-top: 3px; }

    .order-list { list-style: none; margin: 15px 0; max-height: 250px; overflow-y: auto; border-top: 1px solid #eee; }
    .order-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
    .remove-btn { background: #ff5252; color: white; border: none; border-radius: 3px; padding: 3px 8px; cursor: pointer; font-weight: bold; }
    .input-field { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
    .btn-send { width: 100%; padding: 12px; background: #2e7d32; color: white; font-size: 16px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s; }
    .btn-send:hover { background: #1b5e20; }
    .error-msg { color: #f44336; text-align: center; padding: 20px; background: #ffebee; border-radius: 8px; margin: 20px 0; }
  </style>
</head>
<body>

  <h1>Comandero - La Queen 👑</h1>

  <div class="container">
    <div class="menu-section">
      <h2>Categorías</h2>
      <div id="categories" class="categories"></div>
      <div id="products" class="products-grid">Sincronizando inventario con cocina... ⏳</div>
    </div>
    <div class="order-section">
      <h2>Pedido Actual</h2>
      <input type="text" id="mesaInput" class="input-field" placeholder="Mesa / Nombre del Cliente">
      <ul id="orderList" class="order-list"></ul>
      <h3>Total: $<span id="totalPrice">0</span></h3>
      <br>
      <button class="btn-send" onclick="enviarACocina()">🚀 Marcar a Cocina</button>
    </div>
  </div>

  <script>
    // MENÚ CON DESCRIPCIONES DETALLADAS
    const menuData = {
      "Sencillas": [
        { nombre: "Milanesa", precio: 75, descripcion: "Torta sencilla de milanesa de res." },
        { nombre: "Pierna", precio: 75, descripcion: "Torta sencilla de pierna horneada." },
        { nombre: "Salchicha", precio: 75, descripcion: "Torta sencilla de salchicha." },
        { nombre: "Jamón", precio: 75, descripcion: "Torta sencilla de jamón de pierna." },
        { nombre: "Huevo", precio: 75, descripcion: "Torta sencilla de huevo al gusto." },
        { nombre: "Chuleta", precio: 75, descripcion: "Torta sencilla de chuleta ahumada." },
        { nombre: "Q. Puerco", precio: 75, descripcion: "Torta sencilla de queso de puerco." }
      ],
      "Clásicas": [
        { nombre: "Verónica", precio: 80, descripcion: "Milanesa, salchicha y queso Oaxaca." },
        { nombre: "Tatiana", precio: 80, descripcion: "Milanesa, pierna y queso Oaxaca." },
        { nombre: "Mexiquense", precio: 80, descripcion: "Milanesa, chorizo y queso Oaxaca." },
        { nombre: "Alemana", precio: 80, descripcion: "Milanesa, piña y queso Oaxaca." },
        { nombre: "Texana", precio: 80, descripcion: "Milanesa, chuleta y queso Oaxaca." },
        { nombre: "Pachuqueña", precio: 80, descripcion: "Milanesa, pierna y piña." },
        { nombre: "Española", precio: 80, descripcion: "Milanesa, pierna y huevo." },
        { nombre: "Argentina", precio: 80, descripcion: "Milanesa, queso amarillo y queso Oaxaca." },
        { nombre: "Tabasqueña", precio: 80, descripcion: "Milanesa, huevo y queso Oaxaca." },
        { nombre: "Jarocha", precio: 80, descripcion: "Milanesa, queso de puerco y queso blanco." },
        { nombre: "Veracruzana", precio: 80, descripcion: "Milanesa, salchicha y queso de puerco." }
      ],
      "Combinadas": [
        { nombre: "Trailera", precio: 80, descripcion: "Salchicha, pierna y queso Oaxaca." },
        { nombre: "Toluqueña", precio: 80, descripcion: "Salchicha, chorizo y queso Oaxaca." },
        { nombre: "Italiana", precio: 80, descripcion: "Jamón, queso amarillo y queso Oaxaca." },
        { nombre: "Suiza", precio: 85, descripcion: "Queso amarillo, queso Oaxaca y queso blanco." },
        { nombre: "Michoacana", precio: 80, descripcion: "Salchicha, jamón y queso Oaxaca." },
        { nombre: "Poblana", precio: 80, descripcion: "Salchicha, huevo y chorizo." },
        { nombre: "Lambada", precio: 80, descripcion: "Pierna, huevo y chorizo." },
        { nombre: "Holandesa", precio: 80, descripcion: "Salchicha, queso de puerco y jamón." },
        { nombre: "Rusa", precio: 80, descripcion: "Huevo, jamón y queso Oaxaca." },
        { nombre: "Brasileña", precio: 80, descripcion: "Huevo, salchicha y queso Oaxaca." },
        { nombre: "Francesa", precio: 80, descripcion: "Pierna, queso amarillo y queso Oaxaca." },
        { nombre: "Alejandra", precio: 80, descripcion: "Pierna, piña y queso Oaxaca." },
        { nombre: "Hawaiana", precio: 80, descripcion: "Jamón, piña y queso Oaxaca." },
        { nombre: "Oaxaqueña", precio: 80, descripcion: "Pierna, huevo y queso Oaxaca." }
      ],
      "Especiales": [
        { nombre: "Especial", precio: 85, descripcion: "Milanesa, pierna, piña y queso Oaxaca." },
        { nombre: "Diabla", precio: 85, descripcion: "Milanesa, chorizo, piña y queso Oaxaca." },
        { nombre: "Manterola", precio: 85, descripcion: "Milanesa, pierna, chuleta y queso Oaxaca." },
        { nombre: "Pecaminosa", precio: 85, descripcion: "Milanesa, huevo, salchicha y queso de puerco." },
        { nombre: "Torta La Queen", precio: 85, descripcion: "Milanesa, pierna, jamón, queso amarillo, quesillo y aguacate." },
        { nombre: "Mega Cubana Queen", precio: 150, descripcion: "Milanesa, salchicha, jamón, pierna, huevo, quesillo y tocino extra." }
      ],
      "El Tamaño Si Importa": [
        { nombre: "Insaciable", precio: 90, descripcion: "Milanesa, pierna, salchicha, chuleta y queso Oaxaca." },
        { nombre: "Vanidosa", precio: 90, descripcion: "Milanesa, pierna, chorizo, piña y queso Oaxaca." },
        { nombre: "Caprichosa", precio: 90, descripcion: "Milanesa, chorizo, jamón, salchicha y queso Oaxaca." },
        { nombre: "Niña Pobre", precio: 90, descripcion: "Milanesa, huevo, chorizo, chuleta y queso Oaxaca." },
        { nombre: "Bomba", precio: 90, descripcion: "Milanesa, huevo, chorizo, salchicha y queso Oaxaca." },
        { nombre: "Suspiro de Monja", precio: 90, descripcion: "Milanesa, pierna, chorizo, huevo y queso Oaxaca." },
        { nombre: "Cubana", precio: 135, descripcion: "Todos los ingredientes: milanesa, pierna, salchicha, jamón, huevo, chuleta, queso de puerco, queso Oaxaca, piña, chorizo y tocino." }
      ],
      "Extras y Bebidas": [
        { nombre: "Ingrediente Extra", precio: 5, descripcion: "Porción o ingrediente extra a tu torta." },
        { nombre: "Coca Cola", precio: 30, descripcion: "Refresco Coca Cola 600 ml." },
        { nombre: "Agua Embotellada", precio: 20, descripcion: "Agua embotellada 500 ml." }
      ]
    };

    let currentOrder = [];
    let estadosInventario = {};

    // Obtiene el estado del inventario y refresca la categoría actual
    async function cargarInventario() {
      try {
        const res = await fetch('/api/inventario');
        if (res.ok) {
          const inventarioBD = await res.json();
          inventarioBD.forEach(item => {
            estadosInventario[item.nombre] = item;
          });
          
          // Refresca la vista si hay una categoría activa para actualizar los botones al instante
          const categoriaActiva = document.querySelector('.cat-btn.active');
          if (categoriaActiva) {
            renderProducts(categoriaActiva.innerText);
          }
        }
      } catch (err) {
        console.warn("No se pudo conectar con el inventario.", err);
      }
    }

    function init() {
      renderCategories();
      cargarInventario();
      // Refresca automáticamente el inventario cada 60 segundos
      setInterval(cargarInventario, 60000);
    }

    function renderCategories() {
      const catContainer = document.getElementById('categories');
      catContainer.innerHTML = '';
      const categories = Object.keys(menuData);
      categories.forEach((cat, index) => {
        const btn = document.createElement('button');
        btn.className = `cat-btn ${index === 0 ? 'active' : ''}`;
        btn.innerText = cat;
        btn.onclick = () => {
          document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderProducts(cat);
        };
        catContainer.appendChild(btn);
      });
      if (categories.length > 0) renderProducts(categories[0]);
    }

    function renderProducts(category) {
      const prodContainer = document.getElementById('products');
      prodContainer.innerHTML = '';
      
      (menuData[category] || []).forEach(item => {
        // Reglas de Bloqueo desde Firebase
        let productoDB = estadosInventario[item.nombre] || {};
        let estaBloqueado = productoDB.bloqueado === true;
        let limiteHora = productoDB.horaBloqueo;
        
        if (limiteHora) {
          const ahora = new Date();
          const horas = String(ahora.getHours()).padStart(2, '0');
          const minutos = String(ahora.getMinutes()).padStart(2, '0');
          const horaActual = `${horas}:${minutos}`;
          
          if (horaActual >= limiteHora) {
            estaBloqueado = true;
          }
        }

        const div = document.createElement('div');
        div.className = `item-btn ${estaBloqueado ? 'agotado' : ''}`;
        
        let alertaHora = (limiteHora && !estaBloqueado) 
          ? `<span class="alerta-hora">Hasta ${limiteHora}</span>` 
          : '';

        if (estaBloqueado) {
          div.innerHTML = `
            <span>${item.nombre}</span>
            <span class="price">🚫 Agotado</span>
            <span class="desc">No disponible</span>
          `;
        } else {
          div.innerHTML = `
            <span>${item.nombre}</span>
            <span class="price">$${item.precio}</span>
            ${alertaHora}
            <span class="desc">${item.descripcion || ''}</span>
          `;
          div.onclick = () => agregarAlPedido(item);
        }
        
        prodContainer.appendChild(div);
      });
    }

    function agregarAlPedido(item) {
      const existe = currentOrder.find(p => p.nombre === item.nombre);
      if (existe) { existe.cantidad += 1; } else { currentOrder.push({ ...item, cantidad: 1 }); }
      renderOrder();
    }

    function renderOrder() {
      const list = document.getElementById('orderList');
      list.innerHTML = '';
      let total = 0;
      currentOrder.forEach((item, index) => {
        total += item.precio * item.cantidad;
        const li = document.createElement('li');
        li.className = 'order-item';
        li.innerHTML = `
          <span>${item.cantidad}x ${item.nombre}</span>
          <span>$${item.precio * item.cantidad}</span>
          <button class="remove-btn" onclick="quitarDelPedido(${index})">✕</button>
        `;
        list.appendChild(li);
      });
      document.getElementById('totalPrice').innerText = total;
    }

    function quitarDelPedido(index) {
      currentOrder.splice(index, 1);
      renderOrder();
    }

    async function enviarACocina() {
      const mesa = document.getElementById('mesaInput').value.trim();
      if (!mesa) return alert('Por favor escribe la mesa o nombre del cliente.');
      if (currentOrder.length === 0) return alert('Agrega al menos un producto.');

      const pedido = {
        cliente: mesa,
        items: currentOrder,
        estado: 'En Cocina',
        total: parseFloat(document.getElementById('totalPrice').innerText),
        origen: 'staff'
      };

      try {
        const res = await fetch('/api/pedidos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(pedido)
        });
        if (!res.ok) throw new Error(`Error ${res.status}: ${res.statusText}`);
        alert('¡Pedido enviado a cocina!');
        currentOrder = [];
        document.getElementById('mesaInput').value = '';
        renderOrder();
      } catch (e) {
        alert('Error al enviar el pedido: ' + e.message);
      }
    }

    init();
  </script>
</body>
</html>
