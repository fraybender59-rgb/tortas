<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja Maestro - Administración</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #121216; color: #f5f5f7; font-family: monospace; margin: 0; padding: 15px; }
        
        .barra-nav { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; background: #1e1e24; padding: 10px; border-radius: 8px; border: 1px solid #333; }
        .btn-nav { color: #fff; padding: 10px 15px; border-radius: 5px; text-decoration: none; font-weight: bold; cursor: pointer; border: 1px solid #555; display: inline-block; font-size: 0.9rem; }
        .btn-comandero-pub { background: #2d3748; }
        .btn-comandero-caja { background: #4a5568; }
        .btn-almacen { background: #1b5e20; }
        .btn-cocina { background: #bf360c; }
        .btn-ventas { background: #d97706; }
        .btn-cobradas { background: #9333ea; }
        .btn-historial-dias { background: #0d9488; }
        .btn-comprobantes { background: #e11d48; }
        .btn-precios { background: #ff5722; border: none; }
        .btn-tarjeta-conf { background: #3f51b5; border: none; }
        
        .columna { background: #18181f; padding: 15px; border-radius: 10px; border: 1px solid #2a2a35; max-width: 700px; margin: 0 auto; }
        .titulo-columna { text-align: center; color: #ffb74d; border-bottom: 2px solid #333; padding-bottom: 10px; margin-top: 0; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; justify-content: center; flex-wrap: wrap; }
        .tab-btn { background: #2a2a35; color: #aaa; border: 1px solid #444; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-family: monospace; }
        .tab-btn:hover { background: #333; }
        .tab-btn.activa { background: #ff9800; color: #111; border-color: #ff9800; }
        .tab-contenido { display: none; }
        .tab-contenido.activo { display: block; }
        
        .tarjeta-pedido { background: #222; padding: 15px; margin-bottom: 15px; border-radius: 8px; border-left: 5px solid #8bc34a; }
        .tarjeta-pedido.cancelado { border-left-color: #f44336; opacity: 0.7; }
        .tarjeta-pedido.cobrado { border-left-color: #9c27b0; opacity: 0.8; }
        
        .grid-botones { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 10px; }
        .btn-act { padding: 10px; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .btn-pagado { background: #8bc34a; color: #111; }
        .btn-tarjeta { background: #3f51b5; color: #fff; }
        .btn-cortesia { background: #03a9f4; color: #fff; }
        .btn-descuento { background: #9c27b0; color: #fff; }
        .btn-cancelar { background: #f44336; color: #fff; grid-column: span 2; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: flex-start; padding-top: 30px; overflow-y: auto; }
        .modal-content { background: #2a2a35; padding: 20px; border-radius: 10px; width: 90%; max-width: 700px; border: 1px solid #ff9800; margin-bottom: 50px; }
        .btn-modal { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 48%; margin-top: 10px; }
        .btn-ok { background: #8bc34a; color: #111; }
        .btn-cancel { background: #f44336; color: #fff; }
        
        .galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; max-height: 40vh; overflow-y: auto; background: #111; padding: 10px; border-radius: 5px; border: 1px solid #444; margin-top: 15px; }
        .galeria img { width: 100%; height: 120px; object-fit: cover; border-radius: 5px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        
        .historial-tabla { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .historial-tabla th { background: #333; color: #ff9800; padding: 10px; border: 1px solid #444; }
        .historial-tabla td { padding: 8px; text-align: center; border: 1px solid #444; }
        
        input, select { width: 100%; padding: 10px; margin: 5px 0 15px 0; background: #111; color: #fff; border: 1px solid #444; border-radius: 5px; font-size: 1rem; }
    </style>
</head>
<body>

    <div id="bloqueo" style="display:flex; justify-content:center; align-items:center; min-height:100vh; flex-direction:column; gap:20px; background:#121216; position:fixed; inset:0; z-index:9999;">
        <h1 style="color:#ff9800;">🔐 Acceso Restringido</h1>
        <input type="password" id="input-pass" placeholder="Contraseña" style="padding:12px 20px; border-radius:8px; border:2px solid #444; background:#222; color:#fff; font-size:1.2rem; width:280px; text-align:center;" onkeydown="if(event.key==='Enter') verificarPass()">
        <button onclick="verificarPass()" style="padding:12px 40px; background:#ff9800; color:#111; border:none; border-radius:8px; font-weight:bold; font-size:1.1rem; cursor:pointer;">Acceder</button>
        <div id="error-pass" style="color:#f44336; font-weight:bold; display:none;">❌ Contraseña incorrecta</div>
    </div>

    <div id="contenido-admin" style="display:none;">
        <div class="barra-nav">
            <a href="clientes.html" target="_blank" class="btn-nav btn-comandero-pub">📱 Comandero Público</a>
            <a href="comandero.html" target="_blank" class="btn-nav btn-comandero-caja">📝 Comandero Staff</a>
            <a href="almacen.html" target="_blank" class="btn-nav btn-almacen">📦 Almacén</a>
            <a href="cocina.html" target="_blank" class="btn-nav btn-cocina">👨‍🍳 Cocina</a>
            <button onclick="document.getElementById('modal-cortes').style.display='flex';" class="btn-nav btn-ventas">💰 Corte</button>
            <button onclick="document.getElementById('modal-historial').style.display='flex';" class="btn-nav btn-cobradas">📁 Cobradas Hoy</button>
            <button onclick="abrirHistorialDias()" class="btn-nav btn-historial-dias">📅 Historial de Días</button>
            <button onclick="abrirModalComprobantes()" class="btn-nav btn-comprobantes">📸 Ver Comprobantes</button>
            <button onclick="abrirModalPrecios()" class="btn-nav btn-precios">✏️ Precios</button>
            <button onclick="abrirModalTarjeta()" class="btn-nav btn-tarjeta-conf">💳 Config Tarjeta</button>
        </div>

        <div class="columna">
            <h2 class="titulo-columna">📝 Caja Principal</h2>
            <div class="tabs">
                <button class="tab-btn activa" data-tab="tab-clientes" onclick="cambiarTab('tab-clientes')">👤 Clientes</button>
                <button class="tab-btn" data-tab="tab-staff" onclick="cambiarTab('tab-staff')">👨‍🍳 Staff</button>
            </div>
            <div id="tab-clientes" class="tab-contenido activo"><div id="bandeja-clientes">Cargando...</div></div>
            <div id="tab-staff" class="tab-contenido"><div id="bandeja-staff">Cargando...</div></div>
        </div>

        <!-- MODAL: AUTORIZAR MODIFICACIÓN DE CUENTA -->
        <div id="modal-modificar" class="modal-overlay">
            <div class="modal-content">
                <h3 style="color:#03a9f4; text-align:center;">🔑 Autorizar Modificación</h3>
                <p id="mod-cliente-nombre" style="text-align:center; color:#aaa;"></p>

                <!-- Panel de Cortesía -->
                <div id="seccion-mod-producto" style="display:none; background:#111; padding:15px; border-radius:5px; margin-bottom:15px; border:1px solid #444;">
                    <label style="color:#03a9f4;">Seleccionar Producto para hacer Cortesía (Restar al total):</label>
                    <select id="mod-select-producto"></select>
                    <hr style="border-color:#333; margin:15px 0;">
                    <label style="color:#03a9f4;">O aplicar cortesía a toda la cuenta:</label>
                    <button class="btn-modal" style="background:#e91e63; color:white; width:100%; margin-top:5px;" onclick="aplicarCortesiaTotal()">🎁 HACER TODA LA CUENTA CORTESÍA ($0.00)</button>
                </div>

                <!-- Panel de Descuento -->
                <div id="seccion-mod-global" style="display:none; background:#111; padding:15px; border-radius:5px; margin-bottom:15px; border:1px solid #444;">
                    <label style="color:#9c27b0;">Descuento en Porcentaje (%):</label>
                    <input type="number" id="mod-desc-porcentaje" placeholder="Ej: 10 (para 10%)">
                    <label style="color:#9c27b0; margin-top:10px; display:block;">O Descuento Fijo en Dinero ($):</label>
                    <input type="number" id="mod-desc-monto" placeholder="Ej: 50 (para restar $50)">
                </div>

                <hr style="border-color:#444; margin:15px 0;">
                <label style="color:#ff9800; font-weight:bold; text-align:center; display:block;">Contraseña de Administración:</label>
                <input type="password" id="mod-pass" placeholder="***" style="text-align:center; font-size:1.5rem; letter-spacing: 5px;">

                <div style="display:flex; justify-content:space-between; margin-top:15px;">
                    <button class="btn-modal btn-cancel" onclick="document.getElementById('modal-modificar').style.display='none'">Cancelar</button>
                    <button class="btn-modal btn-ok" onclick="procesarModificacion()">Aplicar Cambio</button>
                </div>
            </div>
        </div>

        <!-- OTROS MODALES (Mantenidos igual) -->
        <div id="modal-historial" class="modal-overlay">
            <div class="modal-content"><h3 style="color:#ff9800; text-align:center;">📁 Cobradas Hoy</h3><div id="total-ventas-historial" style="background: #111; color: #8bc34a; font-size: 1.3rem; text-align: center; padding: 10px; border-radius: 5px; margin-bottom: 15px;">Total: $0.00</div><div id="bandeja-historial" style="max-height: 50vh; overflow-y: auto;"></div><button class="btn-modal btn-cancel" style="width:100%;" onclick="document.getElementById('modal-historial').style.display='none'">Cerrar</button></div>
        </div>
        <div id="modal-cortes" class="modal-overlay">
            <div class="modal-content"><h3 style="color:#d97706; text-align:center;">💰 Corte</h3><button class="btn-modal btn-ok" style="width:100%; background:#e11d48; color:white;" onclick="realizarCorte()">🛑 REALIZAR CORTE Y ARCHIVAR</button><button class="btn-modal btn-cancel" style="width:100%; margin-top:10px;" onclick="document.getElementById('modal-cortes').style.display='none'">Cerrar</button></div>
        </div>
        <div id="modal-historial-dias" class="modal-overlay">
            <div class="modal-content"><h3 style="color:#0d9488; text-align:center;">📅 Historial de Cortes</h3><div id="contenido-historial-dias"></div><button class="btn-modal btn-cancel" style="width:100%;" onclick="document.getElementById('modal-historial-dias').style.display='none'">Cerrar</button></div>
        </div>
        <div id="modal-comprobantes" class="modal-overlay">
            <div class="modal-content"><h3 style="color:#e11d48; text-align:center;">📸 Comprobantes</h3><input type="date" id="fecha-comprobantes" onchange="cargarComprobantes()"><div id="galeria-comprobantes" class="galeria"></div><button class="btn-modal btn-cancel" style="width:100%;" onclick="document.getElementById('modal-comprobantes').style.display='none'">Cerrar</button></div>
        </div>
        <div id="visor-imagen" class="modal-overlay" style="z-index:2000; align-items:center;" onclick="this.style.display='none'"><img id="imagen-ampliada" src="" style="max-width:95%; max-height:95%; border:3px solid #8bc34a; border-radius:10px;"></div>
        <div id="modal-accion" class="modal-overlay">
            <div class="modal-content"><h3 id="titulo-accion" style="color:#ff9800; margin-top:0;">Confirmar Acción</h3><div id="cuerpo-accion"></div><div style="display:flex; justify-content:space-between; margin-top:15px;"><button class="btn-modal btn-cancel" onclick="document.getElementById('modal-accion').style.display='none'">Cancelar</button><button class="btn-modal btn-ok" id="btn-confirmar-accion">Confirmar</button></div></div>
        </div>
        <div id="modal-precios" class="modal-overlay"><div class="modal-content"><h3 style="color:#ff5722;">✏️ Precios</h3><button class="btn-modal btn-cancel" style="width:100%;" onclick="document.getElementById('modal-precios').style.display='none'">Cerrar</button></div></div>
        <div id="modal-tarjeta" class="modal-overlay"><div class="modal-content"><h3 style="color:#3f51b5;">💳 Tarjeta</h3><button class="btn-modal btn-cancel" style="width:100%;" onclick="document.getElementById('modal-tarjeta').style.display='none'">Cerrar</button></div></div>
    </div>

    <script>
        const CLAVE = "IBARRITA";
        let pedidosLocales = [];
        let idSeleccionado = null;
        let tabActiva = 'tab-clientes';
        let modoModificacion = '';

        function verificarPass() {
            if (document.getElementById('input-pass').value === CLAVE) {
                sessionStorage.setItem('auth_admin', 'true');
                document.getElementById('bloqueo').style.display = 'none';
                document.getElementById('contenido-admin').style.display = 'block';
                iniciarAdmin();
            } else { document.getElementById('error-pass').style.display = 'block'; }
        }

        (function() {
            if (sessionStorage.getItem('auth_admin') === 'true') {
                document.getElementById('bloqueo').style.display = 'none';
                document.getElementById('contenido-admin').style.display = 'block';
                iniciarAdmin();
            }
        })();

        function iniciarAdmin() { obtenerDatosServidor(); setInterval(obtenerDatosServidor, 4000); }

        function cambiarTab(tabId) {
            tabActiva = tabId;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('activa'));
            document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('activa');
            document.querySelectorAll('.tab-contenido').forEach(c => c.classList.remove('activo'));
            document.getElementById(tabId).classList.add('activo');
            renderBandejas();
        }

        function obtenerDatosServidor() {
            fetch('/api/cuentas').then(r => r.json()).then(pedidos => {
                pedidosLocales = pedidos;
                renderBandejas();
            }).catch(e => console.error('Error fetching:', e));
        }

        function renderBandejas() {
            const clientes = pedidosLocales.filter(p => p.origen === 'cliente' || p.metodoPagoInicial);
            const staff = pedidosLocales.filter(p => !p.origen || p.origen === 'staff' || (!p.metodoPagoInicial && !p.origen));

            document.getElementById('bandeja-clientes').innerHTML = renderListaPedidos(clientes);
            document.getElementById('bandeja-staff').innerHTML = renderListaPedidos(staff);

            let htmlHistorial = "", totalVentas = 0;
            const hoy = new Date().toISOString().split('T')[0];
            const cobradasHoy = pedidosLocales.filter(p => p.estado === 'Cobrado' && p.fecha && p.fecha.startsWith(hoy));
            
            cobradasHoy.forEach(p => { totalVentas += parseFloat(p.total) || 0; htmlHistorial += renderTarjetaPedido(p, true); });
            document.getElementById('bandeja-historial').innerHTML = htmlHistorial || '<p style="text-align:center;">Sin cobros hoy</p>';
            document.getElementById('total-ventas-historial').innerText = `Total Vendido Hoy: $${totalVentas.toFixed(2)}`;
        }

        function renderListaPedidos(pedidos) {
            const activos = pedidos.filter(p => p.estado !== 'Cobrado' && p.estado !== 'Cancelado');
            if (activos.length === 0) return '<p style="color:#666; text-align:center; padding:20px;">Sin pedidos activos</p>';
            let html = '';
            activos.slice().reverse().forEach(p => { html += renderTarjetaPedido(p, false); });
            return html;
        }

        function renderTarjetaPedido(p, esHistorial) {
            let estadoClase = p.estado === 'Cancelado' ? 'cancelado' : p.estado === 'Cobrado' ? 'cobrado' : '';
            let botonFoto = p.tieneFoto ? `<button onclick="verFotoPedido('${p.id}')" style="background:#3f51b5;color:white;border:none;border-radius:4px;padding:2px 8px;cursor:pointer;margin-left:5px;">📸 Foto</button>` : '';
            let productosTexto = p.items.map(i => `<div style="margin-bottom:3px;">${i.cantidad}x ${i.nombre} ($${i.subtotal || (i.cantidad * i.precio)})</div>`).join('');
            
            let notaAdicional = p.notaAdmin ? `<div style="color:#e91e63; font-size:0.9rem; margin-top:5px;">⚠️ ${p.notaAdmin}</div>` : '';

            let botones = "";
            if (!esHistorial && p.estado !== 'Cobrado' && p.estado !== 'Cancelado') {
                botones = `
                <div class="grid-botones">
                    <button class="btn-act btn-pagado" onclick="cobrar('${p.id}', 'Efectivo')">💵 EFECTIVO</button>
                    <button class="btn-act btn-tarjeta" onclick="cobrar('${p.id}', 'Tarjeta')">💳 TARJETA</button>
                    
                    <button class="btn-act btn-cortesia" onclick="abrirModalModificar('${p.id}', 'producto')">🎁 Cortesía</button>
                    <button class="btn-act btn-descuento" onclick="abrirModalModificar('${p.id}', 'global')">📉 Descuento</button>
                    
                    <button class="btn-act btn-cancelar" onclick="accion('${p.id}', 'Cancelado')">❌ Cancelar Cuenta</button>
                </div>`;
            }

            return `
            <div class="tarjeta-pedido ${estadoClase}">
                <div><strong>${p.cliente}</strong> ${botonFoto}</div>
                <hr style="border-color:#333; margin:8px 0;">
                ${productosTexto}
                ${notaAdicional}
                <hr style="border-color:#333; margin:8px 0;">
                <div style="font-size:1.2rem; color:#ff9800;"><strong>Total: $${parseFloat(p.total).toFixed(2)}</strong></div>
                ${botones}
            </div>`;
        }

        // ==========================================
        // LÓGICA DE DESCUENTOS Y CORTESÍAS
        // ==========================================
        window.abrirModalModificar = function(id, tipo) {
            idSeleccionado = id;
            modoModificacion = tipo;
            const pedido = pedidosLocales.find(p => p.id === id);
            document.getElementById('mod-cliente-nombre').innerText = `Cliente: ${pedido.cliente} | Total Actual: $${pedido.total}`;
            document.getElementById('mod-pass').value = '';

            if (tipo === 'producto') {
                document.getElementById('seccion-mod-producto').style.display = 'block';
                document.getElementById('seccion-mod-global').style.display = 'none';
                let options = '<option value="">-- Selecciona el producto a descontar --</option>';
                pedido.items.forEach((item, index) => {
                    let sub = item.subtotal || (item.cantidad * item.precio);
                    options += `<option value="${index}">${item.cantidad}x ${item.nombre} ($${sub})</option>`;
                });
                document.getElementById('mod-select-producto').innerHTML = options;
            } else {
                document.getElementById('seccion-mod-producto').style.display = 'none';
                document.getElementById('seccion-mod-global').style.display = 'block';
                document.getElementById('mod-desc-porcentaje').value = '';
                document.getElementById('mod-desc-monto').value = '';
            }
            document.getElementById('modal-modificar').style.display = 'flex';
        };

        window.aplicarCortesiaTotal = function() {
            if (document.getElementById('mod-pass').value !== CLAVE) return alert("Contraseña incorrecta");
            if (confirm("¿Seguro que deseas hacer TODA la cuenta cortesía ($0.00)?")) {
                ejecutarCambioTotal(0, "Cortesía Total Aplicada");
            }
        };

        window.procesarModificacion = function() {
            if (document.getElementById('mod-pass').value !== CLAVE) return alert("Contraseña incorrecta");
            
            const pedido = pedidosLocales.find(p => p.id === idSeleccionado);
            let nuevoTotal = parseFloat(pedido.total);
            let nota = "";

            if (modoModificacion === 'producto') {
                let index = document.getElementById('mod-select-producto').value;
                if (index === "") return alert("Selecciona un producto de la lista");
                let item = pedido.items[index];
                let sub = parseFloat(item.subtotal || (item.cantidad * item.precio));
                nuevoTotal -= sub;
                nota = `Se restó cortesía: ${item.nombre}`;
            } else {
                let perc = parseFloat(document.getElementById('mod-desc-porcentaje').value);
                let monto = parseFloat(document.getElementById('mod-desc-monto').value);

                if (!isNaN(perc) && perc > 0) {
                    nuevoTotal -= (nuevoTotal * (perc / 100));
                    nota = `Descuento aplicado: ${perc}%`;
                } else if (!isNaN(monto) && monto > 0) {
                    nuevoTotal -= monto;
                    nota = `Descuento aplicado: $${monto}`;
                } else {
                    return alert("Ingresa un porcentaje o un monto válido");
                }
            }

            if (nuevoTotal < 0) nuevoTotal = 0;
            ejecutarCambioTotal(nuevoTotal, nota);
        };

        function ejecutarCambioTotal(nuevoTotal, nota) {
            let datos = { total: nuevoTotal.toFixed(2), notaAdmin: nota };
            let index = pedidosLocales.findIndex(p => String(p.id) === String(idSeleccionado));
            
            if (index !== -1) {
                pedidosLocales[index].total = datos.total;
                pedidosLocales[index].notaAdmin = datos.notaAdmin;
                renderBandejas();
            }
            document.getElementById('modal-modificar').style.display = 'none';

            fetch('/api/cuentas/' + idSeleccionado, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
        }
        // ==========================================

        window.cobrar = function(id, metodo) {
            idSeleccionado = id;
            document.getElementById('titulo-accion').innerText = `Cobro en ${metodo}`;
            document.getElementById('cuerpo-accion').innerHTML = `<p>¿Marcar pedido como pagado con <b>${metodo}</b>?</p>`;
            document.getElementById('btn-confirmar-accion').onclick = () => ejecutar({ estado: 'Cobrado', metodo: metodo });
            document.getElementById('modal-accion').style.display = 'flex';
        };

        window.accion = function(id, tipo) {
            if (tipo === 'Cancelado') {
                idSeleccionado = id;
                document.getElementById('titulo-accion').innerText = `Cancelar Cuenta`;
                document.getElementById('cuerpo-accion').innerHTML = `<p>¿Seguro que deseas cancelar esta cuenta?</p>`;
                document.getElementById('btn-confirmar-accion').onclick = () => ejecutar({ estado: 'Cancelado', motivo: 'Cancelado admin' });
                document.getElementById('modal-accion').style.display = 'flex';
            }
        };

        function ejecutar(datos) {
            document.getElementById('modal-accion').style.display = 'none';

            let index = pedidosLocales.findIndex(p => String(p.id) === String(idSeleccionado));
            if (index !== -1) { 
                pedidosLocales.splice(index, 1); 
                renderBandejas(); 
            }

            fetch('/api/cuentas/' + idSeleccionado, { 
                method: 'DELETE' 
            }).then(res => {
                if(!res.ok) console.error("Fallo al borrar en Firebase");
            }).catch(err => console.error("Error de red:", err));
        }

        function verFotoPedido(id) {
            fetch(`/api/comprobantes/${id}`).then(r => r.json()).then(data => {
                if (data.imagen || data.comprobante) { document.getElementById('imagen-ampliada').src = data.imagen || data.comprobante; document.getElementById('visor-imagen').style.display = 'flex'; } 
                else { alert("Imagen no encontrada."); }
            }).catch(() => alert("Error al cargar comprobante."));
        }
    </script>
</body>
</html>
