<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almacén / Inventario - La Queen 👑</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { padding: 20px; background: #f4f4f9; color: #333; }
    h1 { margin-bottom: 20px; text-align: center; color: #b71c1c; }
    .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .search-bar { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #ddd; border-radius: 6px; font-size: 16px; }
    .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
    .inv-card { background: #fafafa; border: 1px solid #e0e0e0; padding: 15px; border-radius: 8px; text-align: center; transition: 0.3s; }
    .inv-card:hover { box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-color: #b71c1c; }
    .item-name { font-size: 1.1em; font-weight: bold; margin-bottom: 10px; color: #333; }
    .item-stock { font-size: 1.8em; font-weight: bold; color: #2e7d32; margin-bottom: 15px; }
    .item-stock.bajo { color: #d32f2f; }
    .controls { display: flex; justify-content: center; align-items: center; gap: 5px; }
    .input-cant { width: 60px; padding: 8px; text-align: center; border: 1px solid #ccc; border-radius: 4px; }
    .btn { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; }
    .btn-add { background: #1976d2; }
    .btn-add:hover { background: #1565c0; }
    .btn-sub { background: #ff9800; }
    .btn-sub:hover { background: #e65100; }
    .nav-btn { display: inline-block; margin-bottom: 20px; padding: 10px 15px; background: #333; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
    .nav-btn:hover { background: #555; }
    .btn-refresh { display: inline-block; margin-left: 15px; padding: 10px 20px; background: #0d9488; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .btn-refresh:hover { background: #0a7a6e; }
    .header-actions { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 20px; }
    .error-msg { color: #f44336; text-align: center; grid-column: 1 / -1; padding: 20px; background: #ffebee; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="container">
    <a href="administracion.html" class="nav-btn">⬅ Volver a Administración</a>
    <div class="header-actions">
      <h1>📦 Control de Inventario</h1>
      <button class="btn-refresh" onclick="cargarInventario()">🔄 Actualizar</button>
    </div>
    
    <input type="text" id="buscador" class="search-bar" placeholder="Buscar producto o torta (ej. Cubana, Coca Cola...)" onkeyup="filtrarInventario()">

    <div id="inventoryContainer" class="inventory-grid">
      <!-- Los productos se cargarán aquí -->
    </div>
  </div>

  <script>
    let inventarioGlobal = {};
    let primeraCarga = true;
    let intervaloId = null;
    let errorMostrado = false;

    async function cargarInventario() {
      try {
        const res = await fetch('/api/inventario');
        if (!res.ok) throw new Error(`Error ${res.status}: ${res.statusText}`);
        inventarioGlobal = await res.json();
        renderInventario();
        errorMostrado = false;
        // Si había error, reiniciar el intervalo
        if (!intervaloId) {
          intervaloId = setInterval(cargarInventario, 30000);
        }
      } catch (e) {
        console.error("Error al cargar inventario", e);
        const container = document.getElementById('inventoryContainer');
        if (primeraCarga) {
          container.innerHTML = `<div class="error-msg">⚠️ Error al cargar el inventario: ${e.message}.<br>Verifica tu conexión o la cuota de Firestore. Puedes intentar recargar manualmente con el botón "Actualizar".</div>`;
        } else if (!errorMostrado) {
          // Mostrar mensaje en la parte superior
          const msg = document.createElement('div');
          msg.className = 'error-msg';
          msg.innerText = `⚠️ Error al actualizar: ${e.message}. Intenta recargar manualmente.`;
          container.prepend(msg);
          errorMostrado = true;
        }
        // Detener el intervalo para no saturar
        if (intervaloId) {
          clearInterval(intervaloId);
          intervaloId = null;
        }
      }
    }

    function renderInventario() {
      const container = document.getElementById('inventoryContainer');
      const filtro = document.getElementById('buscador').value.toLowerCase();
      const items = Object.keys(inventarioGlobal).sort();

      if (primeraCarga) {
        container.innerHTML = '';
        items.forEach(nombre => {
          const div = document.createElement('div');
          div.className = 'inv-card';
          const idNombre = nombre.replace(/[^a-zA-Z0-9]/g, '_'); 
          div.innerHTML = `
            <div class="item-name">${nombre}</div>
            <div id="stock_${idNombre}" class="item-stock ${inventarioGlobal[nombre] <= 5 ? 'bajo' : ''}">${inventarioGlobal[nombre]} pts</div>
            <div class="controls">
              <input type="number" id="input_${idNombre}" class="input-cant" value="1" min="1">
              <button class="btn btn-add" onclick="modificarStock('${nombre}', '${idNombre}', 'sumar')">➕</button>
              <button class="btn btn-sub" onclick="modificarStock('${nombre}', '${idNombre}', 'restar')">➖</button>
            </div>
          `;
          container.appendChild(div);
        });
        primeraCarga = false;
      } else {
        // Actualizar solo los valores numéricos
        items.forEach(nombre => {
          const idNombre = nombre.replace(/[^a-zA-Z0-9]/g, '_'); 
          const stockEl = document.getElementById('stock_' + idNombre);
          if (stockEl) {
            stockEl.innerText = inventarioGlobal[nombre] + ' pts';
            stockEl.className = 'item-stock ' + (inventarioGlobal[nombre] <= 5 ? 'bajo' : '');
          }
        });
        // Remover mensajes de error previos
        const errors = container.querySelectorAll('.error-msg');
        errors.forEach(el => el.remove());
      }

      // Aplicar filtro de búsqueda
      const cards = container.getElementsByClassName('inv-card');
      for (let card of cards) {
        const name = card.querySelector('.item-name').innerText.toLowerCase();
        card.style.display = name.includes(filtro) ? 'block' : 'none';
      }
    }

    async function modificarStock(nombreReal, idNombre, operacion) {
      const input = document.getElementById(`input_${idNombre}`);
      const cantidad = parseInt(input.value);

      if (isNaN(cantidad) || cantidad <= 0) {
        alert("Por favor ingresa una cantidad válida.");
        return;
      }

      try {
        const res = await fetch('/api/inventario/modificar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre: nombreReal, cantidad, operacion })
        });

        if (res.ok) {
          input.value = 1; 
          cargarInventario(); // Recargar para reflejar cambios
        } else {
          const errorText = await res.text();
          alert("Error al actualizar el inventario: " + errorText);
        }
      } catch (e) {
        console.error("Error", e);
        alert("Error de red al modificar el inventario.");
      }
    }

    function filtrarInventario() {
      renderInventario();
    }

    // Carga inicial
    cargarInventario();
    
    // No inicializamos intervalo automáticamente; se inicia en la primera carga exitosa
  </script>
</body>
</html>
