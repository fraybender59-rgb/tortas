<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almacén / Inventario - La Queen 👑</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { padding: 20px; background: #f4f4f9; color: #333; }
    h1 { margin-bottom: 20px; text-align: center; color: #b71c1c; }
    .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    
    /* Contador de Alertas */
    .alerta-top { background: #ffebee; color: #c62828; border: 2px solid #ef5350; padding: 15px; border-radius: 8px; text-align: center; font-size: 1.2em; font-weight: bold; margin-bottom: 20px; display: none; }
    
    .panel-creacion { background: #e8f5e9; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; border: 2px dashed #4caf50;}
    .input-nuevo { padding: 10px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 200px; font-size: 1rem; }
    .btn-crear { background: #2e7d32; color: white; padding: 10px 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-magico { background: #673ab7; color: white; padding: 10px 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }

    .search-bar { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #ddd; border-radius: 6px; font-size: 16px; }
    .inventory-grid { display: flex; flex-direction: column; gap: 10px; }
    
    /* Tarjeta de Producto */
    .inv-card { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; background: #fafafa; border: 1px solid #e0e0e0; padding: 15px 20px; border-radius: 8px; transition: 0.3s; gap: 10px; }
    .inv-card.bloqueado-ui { background: #eeeeee; border-color: #9e9e9e; opacity: 0.8; }
    .item-name { font-size: 1.2em; font-weight: bold; color: #333; flex: 1; min-width: 200px; }
    .item-stock { font-size: 1.5em; font-weight: bold; color: #2e7d32; width: 100px; text-align: right; }
    .item-stock.bajo { color: #d32f2f; background-color: #ffcdd2; border-radius: 4px; padding: 2px 8px; text-align: center; }
    
    /* Controles de Stock y Bloqueo */
    .controls { display: flex; align-items: center; gap: 5px; }
    .input-cant { width: 60px; padding: 8px; text-align: center; border: 1px solid #ccc; border-radius: 4px; }
    .btn { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; }
    .btn-add { background: #1976d2; }
    .btn-sub { background: #ff9800; }
    
    .lock-controls { display: flex; align-items: center; gap: 8px; border-left: 2px solid #ddd; padding-left: 10px; margin-left: 5px; }
    .btn-lock { background: #d32f2f; }
    .btn-unlock { background: #4caf50; }
    .input-time { padding: 7px; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; }
    .btn-timer { background: #607d8b; }
    .timer-text { font-size: 0.85em; color: #d32f2f; font-weight: bold; }

    .nav-btn { display: inline-block; margin-bottom: 20px; padding: 10px 15px; background: #333; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
    .header-actions { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 20px; }
    .btn-refresh { padding: 10px 20px; background: #0d9488; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <a href="administracion.html" class="nav-btn">⬅ Volver a Administración</a>
    
    <!-- Contador de Alertas de Stock -->
    <div id="alerta-stock" class="alerta-top">
      ⚠️ Tienes <span id="contador-rojo">0</span> productos con 10 unidades o menos.
    </div>

    <div class="header-actions">
      <h1>📦 Control de Inventario y Bloqueos</h1>
      <button class="btn-refresh" onclick="cargarInventario()">🔄 Actualizar Tabla</button>
    </div>

    <div class="panel-creacion">
      <input type="text" id="nuevo-nombre" class="input-nuevo" placeholder="Ej. Torta Especial...">
      <input type="number" id="nuevo-stock" class="input-nuevo" style="flex:0.3; min-width:80px;" placeholder="Stock" value="0" min="0">
      <button class="btn-crear" onclick="crearProductoManual()">➕ Crear Producto</button>
      <button class="btn-magico" id="btn-magico" onclick="autoCargarMenuCompleto()">✨ Cargar Menú Completo</button>
    </div>
    
    <input type="text" id="buscador" class="search-bar" placeholder="Buscar producto o torta..." onkeyup="filtrarInventario()">

    <div id="inventoryContainer" class="inventory-grid">
      <!-- Los productos se cargarán aquí -->
    </div>
  </div>

  <script>
    let inventarioGlobal = {};
    let intervaloId = null;

    const MENU_COMPLETO = [
      "Milanesa", "Pierna", "Salchicha", "Jamón", "Huevo", "Chuleta", "Q. Puerco", "Verónica", "Tatiana", "Mexiquense", "Alemana", "Texana", "Pachuqueña", "Española", "Argentina", "Tabasqueña", "Jarocha", "Veracruzana", "Trailera", "Toluqueña", "Italiana", "Suiza", "Michoacana", "Poblana", "Lambada", "Holandesa", "Rusa", "Brasileña", "Francesa", "Alejandra", "Hawaiana", "Oaxaqueña", "Especial", "Diabla", "Manterola", "Pecaminosa", "Torta La Queen", "Mega Cubana Queen", "Insaciable", "Vanidosa", "Caprichosa", "Niña Pobre", "Bomba", "Suspiro de Monja", "Cubana", "Ingrediente Extra", "Coca Cola", "Agua Embotellada"
    ];

    async function autoCargarMenuCompleto() {
      // (Función sin cambios, mantiene la inyección directa)
      let cargados = 0;
      for(let producto of MENU_COMPLETO) {
        if(!inventarioGlobal[producto]) {
          try {
            await fetch('/api/inventario', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nombre: producto, cantidad: 0 }) });
            cargados++;
          } catch(err) {}
        }
      }
      alert(cargados > 0 ? `✅ Se añadieron ${cargados} productos.` : `✅ Menú sincronizado.`);
      cargarInventario();
    }

    async function crearProductoManual() {
      const nombre = document.getElementById('nuevo-nombre').value.trim();
      const stock = parseInt(document.getElementById('nuevo-stock').value);
      if(!nombre) return alert("Escribe el nombre.");
      
      try {
        await fetch('/api/inventario', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nombre, cantidad: stock }) });
        document.getElementById('nuevo-nombre').value = '';
        cargarInventario();
      } catch(e) { alert("Error de conexión."); }
    }

    async function cargarInventario() {
      try {
        const res = await fetch('/api/inventario');
        const data = await res.json();
        inventarioGlobal = {};
        
        // Ahora guardamos un objeto completo para incluir estados de bloqueo
        data.forEach(item => {
            inventarioGlobal[item.nombre] = {
                cantidad: item.cantidad || 0,
                bloqueado: item.bloqueado || false,
                horaBloqueo: item.horaBloqueo || null
            };
        });

        renderInventario();
        if (!intervaloId) intervaloId = setInterval(cargarInventario, 30000);
      } catch (e) { console.error("Error al cargar"); }
    }

    function renderInventario() {
      const container = document.getElementById('inventoryContainer');
      const filtro = document.getElementById('buscador').value.toLowerCase();
      const items = Object.keys(inventarioGlobal).sort();
      let productosEnRojo = 0;

      container.innerHTML = '';

      items.forEach(nombre => {
        const datos = inventarioGlobal[nombre];
        const idNombre = nombre.replace(/[^a-zA-Z0-9]/g, '_'); 
        
        if(datos.cantidad <= 10) productosEnRojo++;

        const div = document.createElement('div');
        div.className = `inv-card ${datos.bloqueado ? 'bloqueado-ui' : ''}`;
        
        let lockUI = datos.bloqueado 
          ? `<button class="btn btn-unlock" onclick="cambiarEstadoBloqueo('${nombre}', false)">✅ Desbloquear</button>`
          : `<button class="btn btn-lock" onclick="cambiarEstadoBloqueo('${nombre}', true)">🚫 Bloquear</button>`;

        let timerText = datos.horaBloqueo ? `<span class="timer-text">Se bloquea a las ${datos.horaBloqueo}</span>` : '';

        div.innerHTML = `
          <div class="item-name">${nombre} ${datos.bloqueado ? '🔒' : ''} <br> ${timerText}</div>
          <div class="item-stock ${datos.cantidad <= 10 ? 'bajo' : ''}">${datos.cantidad} pts</div>
          
          <div class="controls">
            <input type="number" id="input_${idNombre}" class="input-cant" value="1" min="1">
            <button class="btn btn-add" onclick="modificarStock('${nombre}', '${idNombre}', 'sumar')">➕</button>
            <button class="btn btn-sub" onclick="modificarStock('${nombre}', '${idNombre}', 'restar')">➖</button>
          </div>

          <div class="lock-controls">
            ${lockUI}
            <input type="time" id="hora_${idNombre}" class="input-time">
            <button class="btn btn-timer" title="Programar bloqueo" onclick="programarBloqueoHora('${nombre}', '${idNombre}')">⏰</button>
          </div>
        `;
        
        div.style.display = nombre.toLowerCase().includes(filtro) ? 'flex' : 'none';
        container.appendChild(div);
      });
      
      // Actualizar contador superior
      const alertaDiv = document.getElementById('alerta-stock');
      document.getElementById('contador-rojo').innerText = productosEnRojo;
      alertaDiv.style.display = productosEnRojo > 0 ? 'block' : 'none';
    }

    async function modificarStock(nombreReal, idNombre, operacion) {
      const cantidad = parseInt(document.getElementById(`input_${idNombre}`).value);
      if (isNaN(cantidad) || cantidad <= 0) return;
      try {
        await fetch('/api/inventario/modificar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nombre: nombreReal, cantidad, operacion }) });
        document.getElementById(`input_${idNombre}`).value = 1; 
        cargarInventario();
      } catch (e) { alert("Error al modificar."); }
    }

    // NUEVAS FUNCIONES DE BLOQUEO
    async function cambiarEstadoBloqueo(nombre, estado) {
      try {
        // Enviaremos el estado al backend. Si es bloqueo manual, limpiamos la hora programada.
        await fetch('/api/inventario/bloquear', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre: nombre, bloqueado: estado, horaBloqueo: null })
        });
        cargarInventario();
      } catch (e) { alert("Error al cambiar estado de bloqueo. Verifica que app.js esté actualizado."); }
    }

    async function programarBloqueoHora(nombre, idNombre) {
      const horaInput = document.getElementById(`hora_${idNombre}`).value;
      if(!horaInput) return alert("Por favor, selecciona una hora en el reloj antes de presionar el botón ⏰.");
      
      try {
        await fetch('/api/inventario/bloquear', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre: nombre, bloqueado: false, horaBloqueo: horaInput })
        });
        alert(`⏳ Temporizador activado: ${nombre} se bloqueará automáticamente a las ${horaInput}.`);
        cargarInventario();
      } catch (e) { alert("Error al programar horario."); }
    }

    function filtrarInventario() { renderInventario(); }
    cargarInventario();
  </script>
</body>
</html>
