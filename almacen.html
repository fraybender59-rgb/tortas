<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almacén / Inventario - La Queen 👑</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
    body { padding: 20px; background: #f4f4f9; color: #333; }
    h1 { margin-bottom: 20px; text-align: center; color: #b71c1c; }
    .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .search-bar { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #ddd; border-radius: 6px; font-size: 16px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { background: #222; color: white; padding: 12px; text-align: left; }
    td { padding: 12px; border-bottom: 1px solid #ddd; vertical-align: middle; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    tr:hover { background-color: #f1f1f1; }
    
    .item-stock { font-size: 1.2em; font-weight: bold; color: #2e7d32; text-align: center; }
    .item-stock.bajo { color: #d32f2f; }
    .controls { display: flex; gap: 5px; justify-content: center; }
    .input-cant { width: 60px; padding: 6px; text-align: center; border: 1px solid #ccc; border-radius: 4px; }
    .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; font-size: 1.1em;}
    .btn-add { background: #1976d2; }
    .btn-sub { background: #ff9800; }
    .nav-btn { display: inline-block; margin-bottom: 20px; padding: 10px 15px; background: #333; color: white; text-decoration: none; border-radius: 5px; }
    .error-msg { text-align: center; padding: 20px; color: #d32f2f; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <a href="administracion.html" class="nav-btn">⬅ Volver a Administración</a>
    <h1>📦 Control de Inventario (Lista)</h1>
    <input type="text" id="buscador" class="search-bar" placeholder="Buscar producto..." onkeyup="filtrarInventario()">
    
    <table>
      <thead>
        <tr>
          <th style="width: 40%;">Producto</th>
          <th style="text-align:center; width: 30%;">Existencias</th>
          <th style="text-align:center; width: 30%;">Ajustar Manual</th>
        </tr>
      </thead>
      <tbody id="inventoryContainer">
        <tr><td colspan="3" style="text-align:center; padding: 30px;">⏳ Cargando inventario desde la base de datos...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    let inventarioGlobal = {};

    async function cargarInventario() {
      try {
        const res = await fetch('/api/inventario');
        const data = await res.json();
        
        const container = document.getElementById('inventoryContainer');
        
        // COMPROBACIÓN: Si no hay datos, muestra un error visible.
        if (!data || data.length === 0) {
            container.innerHTML = '<tr><td colspan="3" class="error-msg">⚠️ La base de datos está vacía o no se pudo conectar. Asegúrate de tener productos registrados.</td></tr>';
            return;
        }

        inventarioGlobal = {};
        data.forEach(item => { inventarioGlobal[item.nombre] = item.cantidad || 0; });
        renderInventario();
      } catch (e) { 
        document.getElementById('inventoryContainer').innerHTML = '<tr><td colspan="3" class="error-msg">❌ Error al conectar con el servidor.</td></tr>';
        console.error("Error al cargar inventario", e); 
      }
    }

    function renderInventario() {
      const container = document.getElementById('inventoryContainer');
      const filtro = document.getElementById('buscador').value.toLowerCase();
      const items = Object.keys(inventarioGlobal).sort();

      container.innerHTML = '';
      items.forEach(nombre => {
        if (!nombre.toLowerCase().includes(filtro)) return;
        
        const idNombre = nombre.replace(/[^a-zA-Z0-9]/g, '_');
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-weight:bold; font-size:1.1em;">${nombre}</td>
          <td class="item-stock ${inventarioGlobal[nombre] <= 5 ? 'bajo' : ''}">${inventarioGlobal[nombre]}</td>
          <td>
            <div class="controls">
              <input type="number" id="input_${idNombre}" class="input-cant" value="1" min="1">
              <button class="btn btn-add" onclick="modificarStock('${nombre}', '${idNombre}', 'sumar')">➕</button>
              <button class="btn btn-sub" onclick="modificarStock('${nombre}', '${idNombre}', 'restar')">➖</button>
            </div>
          </td>
        `;
        container.appendChild(tr);
      });
    }

    async function modificarStock(nombreReal, idNombre, operacion) {
      const input = document.getElementById(`input_${idNombre}`);
      const cantidad = parseInt(input.value);
      if (isNaN(cantidad) || cantidad <= 0) return alert("Ingresa cantidad válida");

      await fetch('/api/inventario/modificar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre: nombreReal, cantidad, operacion })
      });
      cargarInventario();
    }

    cargarInventario();
    setInterval(cargarInventario, 30000);
  </script>
</body>
</html>
