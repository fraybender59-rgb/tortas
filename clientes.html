!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú La Queen</title>
    <style>
        body { background-color: #121216; color: #f5f5f7; font-family: monospace; margin: 0; padding: 15px; padding-bottom: 80px; }
        .header { text-align: center; color: #ff9800; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .categorias-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .btn-categoria { background: #222; color: #aaa; border: 1px solid #444; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-family: monospace; }
        .btn-categoria:hover { background: #333; }
        .btn-categoria.activa { background: #8bc34a; color: #111; border-color: #8bc34a; }
        .categoria-seccion { display: none; }
        .producto-card { background: #1e1e24; padding: 15px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #333; display: flex; flex-direction: column; gap: 5px; }
        .producto-header { display: flex; justify-content: space-between; align-items: center; }
        .producto-nombre { font-size: 1.2rem; font-weight: bold; color: #fff; }
        .producto-precio { color: #00bcd4; font-weight: bold; font-size: 1.1rem; }
        .producto-desc { font-size: 0.85rem; color: #aaa; margin-top: 3px; }
        .controles-agregar { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; border-top: 1px dashed #444; padding-top: 10px; }
        .input-comentario { background: #111; color: #fff; border: 1px solid #555; padding: 8px; border-radius: 4px; width: 100%; box-sizing: border-box; font-family: monospace; }
        .btn-agregar { background: #ff9800; color: #111; border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; text-align: center; font-family: monospace; }
        .carrito-flotante { position: fixed; bottom: 0; left: 0; width: 100%; background: #2a2a35; padding: 15px; border-top: 2px solid #ff9800; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; z-index: 100; }
        .btn-ver-carrito { background: #8bc34a; color: #111; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; font-family: monospace; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .modal-titulo { color: #ff9800; text-align: center; margin-bottom: 20px; }
        .item-carrito { background: #1e1e24; padding: 10px; margin-bottom: 10px; border-radius: 5px; border-left: 3px solid #ff9800; }
        .item-nota { color: #03a9f4; font-size: 0.8rem; font-style: italic; display: block; margin-top: 5px; }
        .btn-eliminar { background: #f44336; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; float: right; margin-top: -20px; }
        .seccion-pago { background: #111; padding: 15px; border-radius: 8px; margin-top: 20px; border: 1px solid #444; }
        .input-form { width: 100%; padding: 10px; margin-bottom: 10px; background: #222; color: #fff; border: 1px solid #555; border-radius: 5px; box-sizing: border-box; font-family: monospace; }
        .btn-confirmar { background: #8bc34a; color: #111; width: 100%; padding: 15px; border: none; font-weight: bold; font-size: 1.1rem; border-radius: 5px; cursor: pointer; margin-top: 10px; font-family: monospace; }
        .btn-cerrar-modal { background: #444; color: #fff; width: 100%; padding: 10px; border: none; margin-top: 10px; border-radius: 5px; cursor: pointer; font-family: monospace; }
        .file-upload-wrapper { display: flex; flex-direction: column; align-items: center; gap: 10px; background: #222; padding: 15px; border-radius: 5px; border: 1px dashed #8bc34a; margin-bottom: 10px; }
        .btn-upload { background: #3f51b5; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-family: monospace; }
        .estado-foto-ok { color: #8bc34a; font-weight: bold; }
        .estado-foto-error { color: #f44336; }
        .error-carga { color: #f44336; text-align: center; padding: 20px; background: #1a1a22; border-radius: 8px; margin: 20px 0; }
    </style>
</head>
<body>

    <div class="header">
        <h1>👑 La Queen</h1>
        <p>Tortas Gigantes - El tamaño sí importa</p>
    </div>

    <div id="contenedor-menu">Cargando menú...</div>

    <div class="carrito-flotante">
        <div style="font-size:1.2rem; font-weight:bold;">Total: $<span id="total-flotante">0.00</span></div>
        <button class="btn-ver-carrito" onclick="abrirCarrito()">Ver Pedido (<span id="contador-carrito">0</span>)</button>
    </div>

    <div id="modal-carrito" class="modal">
        <h2 class="modal-titulo">🛒 Tu Pedido</h2>
        <div id="lista-carrito"></div>
        <h3 style="color:#00bcd4; text-align:right;">Total a Pagar: $<span id="total-carrito">0.00</span></h3>
        <div class="seccion-pago">
            <h4 style="color:#ff9800; margin-top:0;">1. Tus Datos</h4>
            <input type="text" id="nombre-cliente" class="input-form" placeholder="Tu Nombre">
            <h4 style="color:#ff9800;">2. Método de Pago</h4>
            <select id="metodo-pago" class="input-form" onchange="verificarMetodoPago()">
                <option value="Efectivo">Efectivo al recoger</option>
                <option value="Transferencia">Transferencia Bancaria</option>
            </select>
            <div id="info-transferencia" style="display:none;">
                <p style="color:#aaa; font-size:0.9rem;">Transfiere a esta cuenta y sube la captura de pantalla:</p>
                <div style="background:#000; padding:10px; text-align:center; font-size:1.2rem; color:#8bc34a; letter-spacing:2px; margin-bottom:10px; border-radius:5px;" id="numero-tarjeta">Cargando tarjeta...</div>
                <div class="file-upload-wrapper">
                    <input type="file" id="input-foto" accept="image/*" style="display:none;" onchange="procesarFoto(event)">
                    <button class="btn-upload" onclick="document.getElementById('input-foto').click()">📸 Subir Captura de Pago</button>
                    <span id="estado-foto" style="color:#aaa; font-size:0.8rem;">Ninguna foto seleccionada</span>
                </div>
            </div>
            <button class="btn-confirmar" onclick="enviarPedido()">🚀 Enviar Pedido a Cocina</button>
        </div>
        <button class="btn-cerrar-modal" onclick="cerrarCarrito()">Volver al Menú</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyTuCodigoLargoRealAqui...",
            authDomain: "tortas-queen.firebaseapp.com",
            projectId: "tortas-queen",
            storageBucket: "tortas-queen.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcde123456789"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.mostrarCategoria = mostrarCategoria;
        window.agregarAlCarrito = agregarAlCarrito;
        window.eliminarDelCarrito = eliminarDelCarrito;
        window.abrirCarrito = abrirCarrito;
        window.cerrarCarrito = cerrarCarrito;
        window.verificarMetodoPago = verificarMetodoPago;
        window.procesarFoto = procesarFoto;
        window.enviarPedido = enviarPedido;

        let carrito = [];
        let fotoBase64 = null;

        // MENÚ ACTUALIZADO DESDE EL COMANDERO
        const menuLocal = {
            "Sencillas": [
                { nombre: "Milanesa", precio: 75, descripcion: "Torta sencilla de milanesa." },
                { nombre: "Pierna", precio: 75, descripcion: "Torta sencilla de pierna horneada." },
                { nombre: "Salchicha", precio: 75, descripcion: "Torta sencilla de salchicha." },
                { nombre: "Jamón", precio: 75, descripcion: "Torta sencilla de jamón de pierna." },
                { nombre: "Huevo", precio: 75, descripcion: "Torta sencilla de huevo al gusto." },
                { nombre: "Chuleta", precio: 75, descripcion: "Torta sencilla de chuleta ahumada." },
                { nombre: "Q. Puerco", precio: 75, descripcion: "Torta sencilla de queso de puerco." }
            ],
            "Clásicas": [
                { nombre: "Verónica", precio: 80, descripcion: "Torta clásica Verónica." },
                { nombre: "Tatiana", precio: 80, descripcion: "Torta clásica Tatiana." },
                { nombre: "Mexiquense", precio: 80, descripcion: "Torta clásica Mexiquense." },
                { nombre: "Alemana", precio: 80, descripcion: "Torta clásica Alemana." },
                { nombre: "Texana", precio: 80, descripcion: "Torta clásica Texana." },
                { nombre: "Pachuqueña", precio: 80, descripcion: "Torta clásica Pachuqueña." },
                { nombre: "Española", precio: 80, descripcion: "Torta clásica Española." },
                { nombre: "Argentina", precio: 80, descripcion: "Torta clásica Argentina." },
                { nombre: "Tabasqueña", precio: 80, descripcion: "Torta clásica Tabasqueña." },
                { nombre: "Jarocha", precio: 80, descripcion: "Torta clásica Jarocha." },
                { nombre: "Veracruzana", precio: 80, descripcion: "Torta clásica Veracruzana." }
            ],
            "Combinadas": [
                { nombre: "Trailera", precio: 80, descripcion: "Torta combinada Trailera." },
                { nombre: "Toluqueña", precio: 80, descripcion: "Torta combinada Toluqueña." },
                { nombre: "Italiana", precio: 80, descripcion: "Torta combinada Italiana." },
                { nombre: "Suiza", precio: 85, descripcion: "Torta combinada Suiza." },
                { nombre: "Michoacana", precio: 80, descripcion: "Torta combinada Michoacana." },
                { nombre: "Poblana", precio: 80, descripcion: "Torta combinada Poblana." },
                { nombre: "Lambada", precio: 80, descripcion: "Torta combinada Lambada." },
                { nombre: "Holandesa", precio: 80, descripcion: "Torta combinada Holandesa." },
                { nombre: "Rusa", precio: 80, descripcion: "Torta combinada Rusa." },
                { nombre: "Brasileña", precio: 80, descripcion: "Torta combinada Brasileña." },
                { nombre: "Francesa", precio: 80, descripcion: "Torta combinada Francesa." },
                { nombre: "Alejandra", precio: 80, descripcion: "Torta combinada Alejandra." },
                { nombre: "Hawaiana", precio: 80, descripcion: "Torta combinada Hawaiana." },
                { nombre: "Oaxaqueña", precio: 80, descripcion: "Torta combinada Oaxaqueña." }
            ],
            "Especiales": [
                { nombre: "Especial", precio: 85, descripcion: "Torta especial de la casa." },
                { nombre: "Diabla", precio: 85, descripcion: "Torta especial Diabla." },
                { nombre: "Manterola", precio: 85, descripcion: "Torta especial Manterola." },
                { nombre: "Pecaminosa", precio: 85, descripcion: "Torta especial Pecaminosa." }
            ],
            "El Tamaño Si Importa": [
                { nombre: "Insaciable", precio: 90, descripcion: "Torta gigante Insaciable." },
                { nombre: "Vanidosa", precio: 90, descripcion: "Torta gigante Vanidosa." },
                { nombre: "Caprichosa", precio: 90, descripcion: "Torta gigante Caprichosa." },
                { nombre: "Niña Pobre", precio: 90, descripcion: "Torta gigante Niña Pobre." },
                { nombre: "Bomba", precio: 90, descripcion: "Torta gigante Bomba." },
                { nombre: "Suspiro de Monja", precio: 90, descripcion: "Torta gigante Suspiro de Monja." },
                { nombre: "Cubana", precio: 135, descripcion: "Torta gigante Cubana completa." }
            ],
            "Extras y Bebidas": [
                { nombre: "Ingrediente Extra", precio: 5, descripcion: "Porción o ingrediente extra." },
                { nombre: "Coca Cola", precio: 30, descripcion: "Refresco Coca Cola." },
                { nombre: "Agua Embotellada", precio: 20, descripcion: "Agua embotellada." }
            ]
        };

        function cargarMenuLocal() {
            try {
                let htmlBotones = '<div class="categorias-container">';
                let htmlProductos = '';
                let primera = true;

                for (let categoria in menuLocal) {
                    let idCat = categoria.replace(/[^a-zA-Z0-9]/g, '-');
                    htmlBotones += `<button class="btn-categoria ${primera ? 'activa' : ''}" onclick="mostrarCategoria('${idCat}')" id="btn-${idCat}">${categoria}</button>`;
                    htmlProductos += `<div id="cat-${idCat}" class="categoria-seccion" style="display:${primera ? 'block' : 'none'};">`;
                    
                    menuLocal[categoria].forEach(prod => {
                        let idInput = prod.nombre.replace(/[^a-zA-Z0-9]/g, '');
                        htmlProductos += `
                        <div class="producto-card">
                            <div class="producto-header">
                                <span class="producto-nombre">${prod.nombre}</span>
                                <span class="producto-precio">$${prod.precio}</span>
                            </div>
                            <div class="producto-desc">${prod.descripcion || ''}</div>
                            <div class="controles-agregar">
                                <input type="text" id="nota-${idInput}" class="input-comentario" placeholder="Ej. Sin cebolla, extra mayo...">
                                <button class="btn-agregar" onclick="agregarAlCarrito('${prod.nombre}', ${prod.precio}, '${idInput}')">Añadir al Carrito</button>
                            </div>
                        </div>`;
                    });
                    htmlProductos += `</div>`;
                    primera = false;
                }
                htmlBotones += '</div>';
                document.getElementById('contenedor-menu').innerHTML = htmlBotones + htmlProductos;
            } catch (err) {
                document.getElementById('contenedor-menu').innerHTML = `<div class="error-carga">⚠️ Error al renderizar el menú local: ${err.message}</div>`;
            }
        }

        cargarMenuLocal();

        function mostrarCategoria(idCat) {
            document.querySelectorAll('.categoria-seccion').forEach(d => d.style.display = 'none');
            document.querySelectorAll('.btn-categoria').forEach(b => b.classList.remove('activa'));
            document.getElementById(`cat-${idCat}`).style.display = 'block';
            document.getElementById(`btn-${idCat}`).classList.add('activa');
        }

        fetch('/api/config/tarjeta')
            .then(r => r.json())
            .then(data => {
                document.getElementById('numero-tarjeta').innerText = data.numero || '1234 5678 9012 3456';
            })
            .catch(() => {
                document.getElementById('numero-tarjeta').innerText = '1234 5678 9012 3456 (default)';
            });

        function agregarAlCarrito(nombre, precio, idInput) {
            let comentario = document.getElementById(`nota-${idInput}`).value;
            let existente = carrito.find(i => i.nombre === nombre && i.comentario === comentario);
            if (existente) { existente.cantidad++; } else { carrito.push({ nombre, precio, cantidad: 1, comentario }); }
            document.getElementById(`nota-${idInput}`).value = "";
            actualizarCarrito();
            let btn = event.target;
            let txt = btn.innerText;
            btn.innerText = "¡Agregado! ✔️";
            btn.style.background = "#8bc34a";
            setTimeout(() => { btn.innerText = txt; btn.style.background = "#ff9800"; }, 1000);
        }

        function actualizarCarrito() {
            let total = carrito.reduce((s, i) => s + i.precio * i.cantidad, 0);
            let cant = carrito.reduce((s, i) => s + i.cantidad, 0);
            document.getElementById('total-flotante').innerText = total.toFixed(2);
            document.getElementById('total-carrito').innerText = total.toFixed(2);
            document.getElementById('contador-carrito').innerText = cant;
            let html = "";
            carrito.forEach((item, idx) => {
                html += `
                <div class="item-carrito">
                    <strong>${item.cantidad}x ${item.nombre}</strong> - $${item.precio * item.cantidad}
                    ${item.comentario ? `<span class="item-nota">Nota: ${item.comentario}</span>` : ''}
                    <button class="btn-eliminar" onclick="eliminarDelCarrito(${idx})">X</button>
                </div>`;
            });
            document.getElementById('lista-carrito').innerHTML = html || "<p style='text-align:center; color:#aaa;'>El carrito está vacío</p>";
        }

        function eliminarDelCarrito(idx) { carrito.splice(idx, 1); actualizarCarrito(); }
        function abrirCarrito() { document.getElementById('modal-carrito').style.display = 'flex'; }
        function cerrarCarrito() { document.getElementById('modal-carrito').style.display = 'none'; }

        function verificarMetodoPago() {
            let metodo = document.getElementById('metodo-pago').value;
            let div = document.getElementById('info-transferencia');
            if (metodo === 'Transferencia') {
                div.style.display = 'block';
            } else {
                div.style.display = 'none';
                fotoBase64 = null;
                document.getElementById('estado-foto').innerText = 'Ninguna foto seleccionada';
                document.getElementById('estado-foto').className = '';
                document.getElementById('input-foto').value = "";
            }
        }

        function procesarFoto(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    let w = img.width, h = img.height;
                    const maxW = 800, maxH = 800;
                    if (w > maxW || h > maxH) {
                        const ratio = Math.min(maxW / w, maxH / h);
                        w = Math.round(w * ratio);
                        h = Math.round(h * ratio);
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    fotoBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    const el = document.getElementById('estado-foto');
                    el.innerText = '✅ Imagen comprimida y lista';
                    el.className = 'estado-foto-ok';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function enviarPedido() {
            if (carrito.length === 0) return alert("Tu carrito está vacío.");
            let nombre = document.getElementById('nombre-cliente').value.trim();
            if (!nombre) return alert("Por favor ingresa tu nombre.");
            let metodo = document.getElementById('metodo-pago').value;

            if (metodo === 'Transferencia' && !fotoBase64) {
                return alert("Por favor sube la captura de pantalla de tu transferencia para verificar el pago.");
            }

            let btn = document.querySelector('.btn-confirmar');
            let txtOriginal = btn.innerText;
            btn.innerText = "⏳ Enviando...";
            btn.disabled = true;

            let total = carrito.reduce((s, i) => s + i.precio * i.cantidad, 0);
            
            let pedido = {
                cliente: nombre,
                items: carrito,
                total: total,
                estado: "Pendiente",
                metodoPagoInicial: metodo,
                origen: 'celular_cliente',
                tieneFoto: fotoBase64 ? true : false,
                fecha: serverTimestamp()
            };

            try {
                const docRef = await addDoc(collection(db, "pedidos"), pedido);

                if (fotoBase64) {
                    await addDoc(collection(db, "comprobantes"), {
                        pedidoId: docRef.id,
                        fecha: new Date().toISOString().split('T')[0],
                        imagen: fotoBase64,
                        creadoEn: serverTimestamp()
                    });
                }

                alert("✅ ¡Tu pedido ha sido enviado a la cocina de La Queen!");
                carrito = [];
                actualizarCarrito();
                cerrarCarrito();
                document.getElementById('nombre-cliente').value = '';
                fotoBase64 = null;
                document.getElementById('estado-foto').innerText = 'Ninguna foto seleccionada';
                document.getElementById('estado-foto').className = '';
                document.getElementById('input-foto').value = "";
                
            } catch (err) {
                console.error(err);
                alert("Hubo un error al enviar tu pedido. Verifica tu conexión a internet.");
            } finally {
                btn.innerText = txtOriginal;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
